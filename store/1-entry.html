<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../public/css/app.css">
<link rel="stylesheet" href="shots.css">
<style>
  .app .date-nav input { padding: 4px 6px; }
  .app .kind-toggle { width: 100%; }
  .app .kind-toggle button { flex: 1; padding: 7px 0; }
  .app .entry-fields label { flex: 1 1 100%; }
  .app .entry-fields .f-amount { flex: 1 1 100%; }
  .app .entry-fields .save { width: 100%; }
  .app kbd { display: none; }
  .app table.grid th, .app table.grid td { padding: 5px 6px; font-size: 13px; }
  .fake-select { padding: 6px 8px; border: 1px solid #b9c0ca; border-radius: 4px; background: #fff; display: flex; justify-content: space-between; color: #1d2330; font-size: 15px; }
  .fake-select::after { content: "▾"; color: #6b7280; }
  .fake-input { padding: 6px 8px; border: 1px solid #b9c0ca; border-radius: 4px; background: #fff; font-size: 15px; color: #1d2330; }
  .fake-input.amount { text-align: right; font-size: 17px; font-weight: 600; outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
</head>
<body class="shot">
  <div class="copy">
    <span class="step">거래 입력</span>
    <h1>수입·지출 입력,<br><em>한 줄이면 끝</em></h1>
    <p>통장과 예산과목을 고르고 금액만 넣으면 저장.<br>통장끼리 옮긴 돈은 이체로 따로 정리됩니다.</p>
  </div>
  <div class="phone"><div class="screen"><div class="notch"></div>
    <div class="app">
      <header class="topbar"><div class="topbar-inner"><span class="brand"><img src="../public/img/logo.png" alt=""></span></div></header>
      <main class="container">
        <section class="entry" id="entry" data-kind="IN">
          <div class="entry-head">
            <div class="date-nav">
              <button class="secondary small">◀</button>
              <span class="fake-input" style="font-weight:600">2026-10-04</span>
              <button class="secondary small">▶</button>
              <span class="muted">일요일</span>
            </div>
            <div class="kind-toggle">
              <button class="in active">수입</button>
              <button class="out">지출</button>
              <button class="transfer">이체·입금</button>
            </div>
          </div>
          <div class="entry-fields">
            <label>통장 <span class="fake-select">교무금</span></label>
            <label>예산과목 <span class="fake-select">교무금</span></label>
            <label class="f-amount">금액(원) <span class="fake-input amount">150,000</span></label>
            <label>적요 <span class="fake-input">김베드로 10월 교무금</span></label>
            <button class="save">저장</button>
          </div>
        </section>
        <section>
          <h2>하루 현황 <small class="muted">10월 4일</small></h2>
          <table class="grid">
            <tr><td>수입</td><td class="num in"><b>1,286,000</b></td></tr>
            <tr><td>지출</td><td class="num out"><b>214,500</b></td></tr>
            <tr><td>이체</td><td class="num">500,000</td></tr>
          </table>
        </section>
        <section>
          <h2>거래 내역</h2>
          <table class="grid tx-list">
            <tr><th>구분</th><th>과목 · 적요</th><th class="num">금액</th></tr>
            <tr><td><span class="badge in">수입</span></td><td>주일헌금<br><span class="small muted">교중미사</span></td><td class="num">842,000</td></tr>
            <tr><td><span class="badge in">수입</span></td><td>교무금<br><span class="small muted">김베드로 10월</span></td><td class="num">150,000</td></tr>
            <tr><td><span class="badge out">지출</span></td><td>전례비<br><span class="small muted">제대 꽃꽂이</span></td><td class="num">120,000</td></tr>
            <tr><td><span class="badge transfer">이체</span></td><td>기타 후원금 → 사회복지 예치금</td><td class="num">500,000</td></tr>
          </table>
        </section>
      </main>
    </div>
  </div></div>
</body>
</html>
