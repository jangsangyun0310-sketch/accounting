<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>본당살림 시작하기</title>
  <link rel="icon" href="/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner narrow"><a href="/new" class="brand"><img src="/img/logo.png" alt="본당살림" width="171" height="48"></a></div></header>
  <main class="container narrow">
    <section class="start-box">
      <h2 class="page-title">본당살림 시작하기</h2>
      <p>우리 성당 전용 회계 장부를 새로 만듭니다. 설치나 가입은 필요 없습니다.</p>
      <ul class="start-points">
        <li>장부의 모든 자료는 <b>이 비밀번호로 암호화</b>되어 저장됩니다. 프로그램 개발자도 내용을 볼 수 없습니다.</li>
        <li>사무원과 함께 쓰시면 비밀번호를 함께 쓰세요.</li>
        <li><b>비밀번호를 잊으면 자료를 되살릴 수 없습니다.</b> 설정 → 백업에서 백업 파일을 자주 내려받아 두세요.</li>
      </ul>
      <form id="start-form" autocomplete="off">
        <label>비밀번호 (8자 이상) <input type="password" id="pw1" minlength="8" required autofocus></label>
        <label>비밀번호 확인 <input type="password" id="pw2" minlength="8" required></label>
        <label class="check"><input type="checkbox" id="ack" required>
          비밀번호를 잊으면 누구도(개발자 포함) 자료를 되살릴 수 없다는 것을 이해했습니다.</label>
        <button type="submit" id="start">장부 만들기</button>
        <p class="error" id="start-error" role="alert"></p>
      </form>
    </section>
  </main>
  <script type="module" src="/js/new.js"></script>
</body>
</html>
