<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>거래 입력 - 본당살림</title>
  <link rel="icon" href="/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="topbar" class="topbar"><div class="topbar-inner wide"><a href="/" class="brand"><img src="/img/logo.png" alt="본당살림" width="171" height="48"></a></div></header>
  <main class="container wide">
    <section class="entry" id="entry">
      <div class="entry-head">
        <div class="date-nav">
          <button type="button" class="secondary small" id="prev-day" title="전날">◀</button>
          <input type="date" id="date" aria-label="거래일">
          <button type="button" class="secondary small" id="next-day" title="다음날">▶</button>
          <button type="button" class="secondary small" id="today">오늘</button>
          <span id="date-label" class="muted"></span>
        </div>
        <div class="kind-toggle" role="radiogroup" aria-label="거래 구분">
          <button type="button" data-kind="IN" class="in">수입 <kbd>F2</kbd></button>
          <button type="button" data-kind="OUT" class="out">지출 <kbd>F3</kbd></button>
          <button type="button" data-kind="TRANSFER" class="transfer" title="통장끼리 돈을 옮길 때">이체 <kbd>F4</kbd></button>
        </div>
      </div>

      <div id="lock-banner" class="lock-banner" hidden>
        이 날짜는 <b>마감</b>되었습니다. 거래를 입력·수정하려면 먼저 <a id="lock-link" href="/closing">일 마감 화면</a>에서 마감취소를 해야 합니다.
      </div>
      <div id="edit-banner" class="edit-banner" hidden>
        <span id="edit-label"></span> 수정 중입니다. 내용을 고친 뒤 저장하세요.
        <button type="button" class="secondary small" id="cancel-edit">수정 취소 <kbd>Esc</kbd></button>
      </div>

      <div class="entry-fields" id="fields">
        <label class="f-normal">통장 <select id="account"></select></label>
        <label class="f-transfer">보내는 통장 (출금) <select id="from-account"></select></label>
        <label class="f-transfer">받는 통장 (입금) <select id="to-account"></select></label>
        <label class="f-payer" id="payer-field" hidden>봉헌자 <span class="req">*</span> <input id="payer" maxlength="30" list="payer-list" autocomplete="off" placeholder="이름 (꼭 적기)"></label>
        <datalist id="payer-list"></datalist>
        <label class="f-amount">금액(원) <input id="amount" placeholder="0"></label>
        <label class="f-memo">내용 <input id="memo" maxlength="100" list="memo-list" autocomplete="off" placeholder="예) 성소후원"></label>
        <datalist id="memo-list"></datalist>
        <button type="button" id="save" class="save">저장 <kbd>Enter</kbd></button>
      </div>
      <div id="close-bar" class="close-bar"></div>
      <p class="help f-transfer transfer-help">💡 <b>이체</b>는 통장끼리 돈을 옮길 때 씁니다. 수입·지출에 잡히지 않고 두 통장의 잔액만 바뀝니다.</p>
    </section>

    <section>
      <div class="section-head book-head">
        <h2>통장 가계부 <small id="book-month" class="muted"></small></h2>
        <span class="book-nav">
          <button type="button" class="secondary small" id="book-prev" title="전달">◀</button>
          <button type="button" class="secondary small" id="book-next" title="다음 달">▶</button>
        </span>
      </div>
      <div id="book"></div>
    </section>
  </main>
  <dialog id="action-dialog"></dialog>
  <script type="module" src="/js/entry.js"></script>
</body>
</html>
