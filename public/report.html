<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결산서 - 본당살림</title>
  <link rel="icon" href="/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body class="report-page">
  <header id="topbar" class="topbar no-print"><div class="topbar-inner a4"><a href="/" class="brand"><img src="/img/logo.png" alt="본당살림" width="171" height="48"></a></div></header>
  <div class="report-tabs no-print" id="report-tabs" role="tablist">
    <button type="button" data-type="week">주간결산서</button>
    <button type="button" data-type="month">월말결산서</button>
    <button type="button" data-type="cashbook">금전출납부</button>
    <button type="button" data-type="gl">총계정원장</button>
    <button type="button" data-type="donors">봉헌자 조회</button>
  </div>
  <div class="report-toolbar no-print">
    <div class="date-nav">
      <button type="button" class="secondary small" id="prev" title="이전">◀</button>
      <input type="date" id="week" aria-label="결산 주 (고른 날이 든 주일~토요일)" title="아무 날이나 고르면 그 주(주일~토요일)" hidden>
      <input type="month" id="month" aria-label="결산 월">
      <select id="year" aria-label="연도" hidden></select>
      <button type="button" class="secondary small" id="next" title="다음">▶</button>
      <button type="button" class="secondary small" id="now">이번 달</button>
    </div>
    <span class="toolbar-actions">
      <button type="button" class="secondary" id="excel">Excel로 내려받기</button>
      <button type="button" id="print">인쇄</button>
    </span>
    <span id="state"></span>
  </div>
  <details class="print-guide no-print"><summary>인쇄 설정 안내</summary>인쇄 창에서 용지 <b>A4</b> · 여백 <b>기본값</b> · 배율 <b>기본값(100)</b> · 머리글과 바닥글 <b>해제</b>로 맞춥니다.</details>
  <div id="warning" class="no-print"></div>
  <div class="paper-scroll"><div class="paper" id="paper"><p class="muted">불러오는 중…</p></div></div>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
