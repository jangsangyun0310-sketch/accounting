<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결산서 - 본당살림</title>
  <link rel="icon" href="/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body class="report-page">
  <header id="topbar" class="topbar no-print"><a href="/" class="brand"><img src="/img/logo.png" alt="본당살림" width="171" height="48"></a></header>
  <div class="report-tabs no-print" id="report-tabs" role="tablist">
    <button type="button" data-type="day">일일결산</button>
    <button type="button" data-type="month">월말결산</button>
    <button type="button" data-type="year">연말결산</button>
  </div>
  <div class="report-toolbar no-print">
    <div class="date-nav">
      <button type="button" class="secondary small" id="prev" title="이전">◀</button>
      <input type="date" id="date" aria-label="결산일">
      <input type="month" id="month" aria-label="결산 월">
      <select id="year" aria-label="결산 연도"></select>
      <button type="button" class="secondary small" id="next" title="다음">▶</button>
      <button type="button" class="secondary small" id="now">오늘</button>
    </div>
    <span id="state"></span>
    <button type="button" id="print">인쇄 <kbd>Ctrl+P</kbd></button>
  </div>
  <p class="print-guide no-print">인쇄 창 설정: 용지 <b>A4</b> · 여백 <b>기본값</b> · 배율 <b>기본값(100)</b> · 머리글과 바닥글 <b>해제</b></p>
  <div id="warning" class="no-print"></div>
  <div class="paper-scroll"><div class="paper" id="paper"><p class="muted">불러오는 중…</p></div></div>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
